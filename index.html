<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ganeaysh Kulkarni | Global Director</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #0a0f1a;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated background */
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(ellipse at 0% 0%, rgba(30, 58, 110, 0.2) 0%, transparent 50%),
                radial-gradient(ellipse at 100% 0%, rgba(21, 44, 84, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 100% 100%, rgba(30, 58, 110, 0.2) 0%, transparent 50%),
                radial-gradient(ellipse at 0% 100%, rgba(11, 26, 54, 0.15) 0%, transparent 50%);
            animation: bgPulse 8s ease-in-out infinite alternate;
        }

        @keyframes bgPulse {
            0% { opacity: 0.8; }
            100% { opacity: 1; }
        }

        /* Floating particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(59, 111, 196, 0.3);
            border-radius: 50%;
            animation: float 15s infinite;
        }

        .particle:nth-child(1) { left: 10%; animation-delay: 0s; animation-duration: 20s; }
        .particle:nth-child(2) { left: 20%; animation-delay: 2s; animation-duration: 18s; }
        .particle:nth-child(3) { left: 30%; animation-delay: 4s; animation-duration: 22s; }
        .particle:nth-child(4) { left: 40%; animation-delay: 1s; animation-duration: 19s; }
        .particle:nth-child(5) { left: 50%; animation-delay: 3s; animation-duration: 21s; }
        .particle:nth-child(6) { left: 60%; animation-delay: 5s; animation-duration: 17s; }
        .particle:nth-child(7) { left: 70%; animation-delay: 2s; animation-duration: 23s; }
        .particle:nth-child(8) { left: 80%; animation-delay: 4s; animation-duration: 16s; }
        .particle:nth-child(9) { left: 90%; animation-delay: 1s; animation-duration: 20s; }

        @keyframes float {
            0%, 100% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) scale(1);
                opacity: 0;
            }
        }

        .card-container {
            position: relative;
            z-index: 10;
        }

        .card {
            background: linear-gradient(165deg, #ffffff 0%, #f9fafb 100%);
            border-radius: 32px;
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.1),
                0 60px 120px -20px rgba(0, 0, 0, 0.6),
                0 30px 60px -30px rgba(30, 58, 110, 0.3);
            max-width: 1050px;
            width: 100%;
            display: grid;
            grid-template-columns: 380px 1fr;
            overflow: hidden;
            position: relative;
            animation: cardEntrance 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transform: translateY(30px);
            opacity: 0;
        }

        @keyframes cardEntrance {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* Glowing border effect */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg,
                #0b1a36 0%,
                #1e3a6e 25%,
                #3b6fc4 50%,
                #1e3a6e 75%,
                #0b1a36 100%);
            background-size: 200% 100%;
            animation: shimmer 3s linear infinite;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .left-section {
            background: linear-gradient(160deg, #1e3a6e 0%, #152c54 50%, #0b1a36 100%);
            padding: 60px 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Decorative circles */
        .left-section::before {
            content: '';
            position: absolute;
            top: -100px;
            right: -100px;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
            border-radius: 50%;
        }

        .left-section::after {
            content: '';
            position: absolute;
            bottom: -80px;
            left: -80px;
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(0,0,0,0.15) 0%, transparent 70%);
            border-radius: 50%;
        }

        .profile-photo-wrapper {
            position: relative;
            z-index: 2;
            margin-bottom: 30px;
        }


        .profile-photo-container {
            width: 240px;
            height: 240px;
            border-radius: 50%;
            padding: 6px;
            background: linear-gradient(145deg, rgba(255,255,255,0.95), rgba(255,255,255,0.6));
            box-shadow:
                0 25px 50px rgba(0, 0, 0, 0.35),
                0 10px 20px rgba(0, 0, 0, 0.2),
                inset 0 0 30px rgba(255, 255, 255, 0.3);
            position: relative;
            overflow: hidden;
        }

        .profile-photo {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            object-position: center 15%;
            display: block;
            transform: scale(0.92);
        }


        .cargill-logo {
            position: relative;
            z-index: 2;
            margin-top: 25px;
            background: rgba(255, 255, 255, 0.98);
            padding: 18px 28px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
        }

        .cargill-logo img {
            height: 55px;
            display: block;
        }

        .right-section {
            padding: 55px 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }

        .name {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 2.4rem;
            font-weight: 700;
            color: #1a365d;
            margin-bottom: 12px;
            line-height: 1.15;
            letter-spacing: -0.5px;
            animation: fadeInUp 0.8s ease 0.2s both;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .subtitle {
            font-size: 0.95rem;
            color: #4a6fa5;
            font-weight: 500;
            margin-bottom: 4px;
            animation: fadeInUp 0.8s ease 0.3s both;
        }

        .title {
            font-size: 1.1rem;
            color: #2c5282;
            font-weight: 700;
            margin-bottom: 28px;
            animation: fadeInUp 0.8s ease 0.35s both;
        }

        .contact-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 28px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 16px;
            text-decoration: none;
            color: inherit;
            padding: 14px 18px;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            border-radius: 14px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid #e2e8f0;
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.8s ease calc(0.4s + var(--delay, 0s)) both;
        }

        .contact-item:nth-child(1) { --delay: 0s; }
        .contact-item:nth-child(2) { --delay: 0.08s; }
        .contact-item:nth-child(3) { --delay: 0.16s; }
        .contact-item:nth-child(4) { --delay: 0.24s; }

        .contact-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(26, 54, 93, 0.05), transparent);
            transition: left 0.5s ease;
        }

        .contact-item:hover::before {
            left: 100%;
        }

        .contact-item:hover {
            background: linear-gradient(135deg, #e8f4fc 0%, #d0e8f7 100%);
            border-color: #1a365d;
            transform: translateX(8px);
            box-shadow: 0 10px 40px rgba(26, 54, 93, 0.15);
        }

        .contact-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(145deg, #1a365d 0%, #0f2942 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 6px 20px rgba(26, 54, 93, 0.35);
            transition: all 0.3s ease;
        }

        .contact-item:hover .contact-icon {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(26, 54, 93, 0.45);
        }

        .contact-icon svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
        }

        .contact-content {
            flex: 1;
            min-width: 0;
        }

        .contact-label {
            font-size: 0.68rem;
            color: #7c9ac7;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
            margin-bottom: 3px;
        }

        .contact-value {
            font-size: 0.95rem;
            color: #1a365d;
            font-weight: 600;
        }

        .email-addresses {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .email-primary {
            font-size: 0.95rem;
            color: #1a365d;
            font-weight: 600;
        }

        .email-secondary {
            font-size: 0.78rem;
            color: #4a6fa5;
            font-weight: 500;
        }

        .contact-arrow {
            opacity: 0;
            transform: translateX(-15px);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .contact-item:hover .contact-arrow {
            opacity: 1;
            transform: translateX(0);
        }

        .contact-arrow svg {
            width: 20px;
            height: 20px;
            fill: #1a365d;
        }

        .btn-save {
            width: 100%;
            margin-bottom: 14px;
            background: linear-gradient(145deg, #1e3a6e 0%, #0b1a36 100%);
            color: #ffffff;
            box-shadow:
                0 10px 30px rgba(30, 58, 110, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            animation: fadeInUp 0.8s ease 0.65s both;
            letter-spacing: 0.2px;
        }

        .btn-save:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(30, 58, 110, 0.5);
        }

        .btn-save svg { fill: #ffffff; }

        .action-buttons {
            display: flex;
            gap: 14px;
            animation: fadeInUp 0.8s ease 0.7s both;
        }

        .btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px 24px;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            border: none;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, transparent 30%, rgba(255,255,255,0.2) 50%, transparent 70%);
            transform: translateX(-100%);
            transition: transform 0.6s ease;
        }

        .btn:hover::before {
            transform: translateX(100%);
        }

        .btn-call {
            background: linear-gradient(145deg, #1a365d 0%, #0f2942 100%);
            color: #ffffff;
            box-shadow:
                0 10px 30px rgba(26, 54, 93, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .btn-call:hover {
            transform: translateY(-4px);
            box-shadow:
                0 20px 40px rgba(26, 54, 93, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .btn-call:active {
            transform: translateY(-2px);
        }

        .btn-email {
            background: #ffffff;
            color: #1a365d;
            border: 2px solid #1a365d;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .btn-email:hover {
            background: #1a365d;
            color: #ffffff;
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(26, 54, 93, 0.4);
        }

        .btn-email:hover svg {
            fill: #ffffff;
        }

        .btn svg {
            width: 20px;
            height: 20px;
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
        }

        .btn-call svg {
            fill: #ffffff;
        }

        .btn-email svg {
            fill: #1a365d;
        }

        .btn-whatsapp {
            background: linear-gradient(145deg, #25D366 0%, #128C7E 100%);
            color: #ffffff;
            box-shadow: 0 10px 30px rgba(37, 211, 102, 0.4);
        }

        .btn-whatsapp:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(37, 211, 102, 0.5);
        }

        .btn-whatsapp svg {
            fill: #ffffff;
        }

        .btn-linkedin {
            background: linear-gradient(145deg, #0077B5 0%, #005885 100%);
            color: #ffffff;
            box-shadow: 0 10px 30px rgba(0, 119, 181, 0.4);
        }

        .btn-linkedin:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0, 119, 181, 0.5);
        }

        .btn-linkedin svg {
            fill: #ffffff;
        }

        .btn span {
            position: relative;
            z-index: 1;
        }

        .website-footer {
            margin-top: 24px;
            text-align: center;
            padding-top: 18px;
            border-top: 1px solid #e2e8f0;
            animation: fadeInUp 0.8s ease 0.8s both;
        }

        .website-footer a {
            color: #1a365d;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            padding: 8px 16px;
            border-radius: 8px;
        }

        .website-footer a:hover {
            background: #e8f4fc;
            color: #0f2942;
        }

        .website-footer svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* Mobile Responsive */
        @media (max-width: 850px) {
            body {
                padding: 15px;
                align-items: flex-start;
                padding-top: 25px;
            }

            .card {
                grid-template-columns: 1fr;
                max-width: 450px;
                border-radius: 28px;
            }

            .left-section {
                padding: 45px 35px;
            }

            .profile-photo-container {
                width: 180px;
                height: 180px;
            }

            .cargill-logo {
                padding: 14px 22px;
            }

            .cargill-logo img {
                height: 45px;
            }

            .right-section {
                padding: 35px 30px;
            }

            .name {
                font-size: 1.9rem;
                text-align: center;
            }

            .title, .subtitle {
                text-align: center;
            }

            .action-buttons {
                flex-direction: column;
            }

            .contact-item:hover {
                transform: translateX(0) scale(1.02);
            }
        }

        @media (max-width: 400px) {
            .name {
                font-size: 1.6rem;
            }

            .contact-value {
                font-size: 0.85rem;
            }

            .btn {
                padding: 14px 18px;
            }
        }

        /* Print styles */
        @media print {
            body {
                background: white;
            }
            .bg-gradient, .particles {
                display: none;
            }
            .card {
                box-shadow: none;
                border: 1px solid #e2e8f0;
            }
        }
    </style>
</head>
